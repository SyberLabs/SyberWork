name: g3-bridge-adversarial-pass

# Factory gate G3 for the SyberWork bridge row (FACTORY red-team rubric §2/§3).
# Additive: its own workflow, so it does not touch ci.yml (G8), factory-gates.yml
# (G6) or g2-bridge-quota-floor.yml (G2). Branch protection decides whether it is
# required. Gate status lives in docs/G3_BRIDGE_ADVERSARIAL_PASS.md; update it only
# from real run output. Attest's G3 is a separate gate in the attest repo.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  g3-bridge-adversarial-pass:
    # Fails when any active SyberWork bridge red-team case (tests/test_bridge_redteam*.py
    # CASES) or positive control does not pass, when an xfail stops failing an assertion,
    # or when a stub has no reason. xfail and stub cases are open gaps, never passes.
    name: G3 Bridge adversarial pass
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      # The gate's own rules first, on synthetic inventories: a failing, skipped or
      # missing active case, an xpass, a crashed xfail, a stub with no reason and a
      # missing positive control must all fail, and a soft suite must not catch a twin.
      - name: Gate controls
        run: PYTHONPATH=. python -m unittest -v tests.test_g3_bridge_adversarial_pass
      # Runs even if the controls failed, so one run reports the real result.
      - name: Active bridge red-team cases (R1-R9)
        if: ${{ !cancelled() }}
        run: PYTHONPATH=. python scripts/g3_bridge_adversarial_pass.py --report "$RUNNER_TEMP/g3-report.json"
      # The same suite against a refuse-everything and an accept-everything destination
      # match, each in a throwaway copy of the tree. Both must turn the gate red.
      - name: Refuse-everything and accept-everything twins
        if: ${{ !cancelled() }}
        run: PYTHONPATH=. python scripts/g3_bridge_adversarial_pass.py --twins "$RUNNER_TEMP/g3-report.json"
