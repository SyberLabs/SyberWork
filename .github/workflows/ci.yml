name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: syber
          POSTGRES_PASSWORD: syber
          POSTGRES_DB: syberwork
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U syber -d syberwork"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SYBERWORK_POSTGRES_URL: postgresql://syber:syber@localhost:5432/syberwork
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install PostgreSQL driver
        run: python -m pip install "psycopg[binary]>=3.1"
      - name: Install test extras
        run: python -m pip install -e ".[test]"
      - name: Unit tests
        run: PYTHONPATH=. python -m unittest discover -s tests -q
      - name: Conformance
        run: PYTHONPATH=. python -m conformance.run

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Boot a cell, settle an effect, restart, and restore
        run: bash scripts/compose_cell.sh

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Install test extras
        run: python -m pip install -e ".[test]"
      - name: Unit tests
        run: $env:PYTHONPATH='.'; python -m unittest discover -s tests -q
