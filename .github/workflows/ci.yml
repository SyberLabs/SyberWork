name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: syber
          POSTGRES_PASSWORD: syber
          POSTGRES_DB: syberwork
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U syber -d syberwork"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SYBERWORK_POSTGRES_URL: postgresql://syber:syber@localhost:5432/syberwork
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install PostgreSQL driver
        run: python -m pip install "psycopg[binary]>=3.1"
      - name: Install test extras
        run: python -m pip install -e ".[test]"
      - name: Unit tests
        run: PYTHONPATH=. python -m unittest discover -s tests -q
      - name: Conformance
        run: PYTHONPATH=. python -m conformance.run

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Boot a cell, settle an effect, restart, and restore
        run: bash scripts/compose_cell.sh

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Install test extras
        run: python -m pip install -e ".[test]"
      - name: Unit tests
        run: $env:PYTHONPATH='.'; python -m unittest discover -s tests -q

  # FACTORY gate G8 (Existing tests). g8-suite runs the same unit suite and conformance as
  # `test`, through scripts/g8_existing_suite.py, which also fails when a test skips for any
  # reason but a missing optional tool (node, npm, playwright), so an unreachable PostgreSQL
  # or a missing hypothesis cannot leave the suite green with those tests unrun.
  g8-suite:
    name: G8 Existing suite (strict, 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: syber
          POSTGRES_PASSWORD: syber
          POSTGRES_DB: syberwork
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U syber -d syberwork"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SYBERWORK_POSTGRES_URL: postgresql://syber:syber@localhost:5432/syberwork
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Install PostgreSQL driver
        run: python -m pip install "psycopg[binary]>=3.1"
      - name: Install test extras
        run: python -m pip install -e ".[test]"
      - name: Unit tests, no unexplained skips
        run: PYTHONPATH=. python scripts/g8_existing_suite.py --report g8-existing-suite.json
      - name: Conformance
        run: PYTHONPATH=. python -m conformance.run
      - if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: g8-existing-suite
          path: g8-existing-suite.json
          if-no-files-found: ignore

  # The one G8 check: it passes only when every leg of `test` (3.11, 3.12, 3.13),
  # `windows` and `g8-suite` succeeded. A failed, cancelled or skipped leg fails it.
  g8:
    name: G8 Existing suite
    needs: [test, windows, g8-suite]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every leg of the existing suite passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          {
            echo "### G8 Existing suite"
            echo
            echo "| job | result |"
            echo "|---|---|"
            echo "$NEEDS" | jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'length == 3 and all(.[]; .result == "success")' > /dev/null
