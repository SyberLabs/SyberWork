[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "syberwork"
version = "0.1.0"
description = "Contract-governed work execution"
requires-python = ">=3.11"

[project.scripts]
syberwork = "syberwork.cli:main"

[tool.setuptools.package-data]
syberwork = ["static/*", "examples/*.json"]
