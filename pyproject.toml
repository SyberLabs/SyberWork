[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "syberwork"
version = "0.1.0"
description = "Contract-governed work execution and the SyberLabs SDK core"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]

[project.scripts]
syberwork = "syberwork.cli:main"
syberlabs = "syberlabs.cli:main"

[tool.setuptools]
packages = ["syberwork", "syberlabs"]

[tool.setuptools.package-data]
syberwork = ["static/*", "examples/*.json"]
syberlabs = ["static/*"]
