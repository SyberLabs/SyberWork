<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>SyberWork console</title><link rel="stylesheet" href="/style.css"></head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="topbar">
  <div class="brand" aria-label="SyberWork"><span class="mark" aria-hidden="true">S/W</span><span class="word">SyberWork</span><span class="scope">local cell</span></div>
  <nav class="views" aria-label="Views">
    <button type="button" data-view="cases" aria-keyshortcuts="g c">Cases</button>
    <button type="button" data-view="studio" aria-keyshortcuts="g s">Studio</button>
  </nav>
  <div id="metrics" class="metrics" aria-label="Cell metrics"></div>
  <div class="spacer"></div>
  <button type="button" id="identity-button" class="identity-button" aria-haspopup="dialog" aria-keyshortcuts="i">
    <span class="who" id="identity-name">Not connected</span><span id="identity-roles" class="roles"></span><kbd>i</kbd>
  </button>
  <button type="button" id="help-button" class="ghost icon" aria-label="Keyboard shortcuts and legend" aria-keyshortcuts="?">?</button>
</header>
<div class="frame">
  <aside class="rail" aria-label="Cases">
    <div class="rail-head">
      <input id="case-filter" type="search" placeholder="Filter cases" aria-label="Filter cases" aria-keyshortcuts="/" autocomplete="off">
      <button type="button" id="new-case" class="primary" aria-keyshortcuts="n">New case <kbd>n</kbd></button>
    </div>
    <div id="case-list" class="case-list" role="listbox" aria-label="Cases" tabindex="0"></div>
  </aside>
  <main id="main" tabindex="-1"></main>
</div>
<div id="toasts" class="toasts" role="status" aria-live="polite"></div>

<dialog id="identity-dialog" aria-labelledby="identity-title">
  <form method="dialog" class="dialog-head"><h2 id="identity-title">Identity</h2><button class="ghost icon" aria-label="Close">×</button></form>
  <p class="hint">Each credential is a separate actor. Tokens stay in this tab's session storage and are sent only to this loopback service as a bearer token. Use one credential per role: the proposer, approver and signer must differ.</p>
  <div id="identity-list" class="identity-list"></div>
  <form id="identity-form" class="stack">
    <label>Add a credential<input id="token" type="password" autocomplete="off" spellcheck="false" placeholder="Token printed by syberwork init" required></label>
    <div class="row-end"><button type="button" id="forget-all" class="ghost danger-text">Forget all</button><button class="primary">Connect</button></div>
  </form>
</dialog>

<dialog id="newcase-dialog" aria-labelledby="newcase-title">
  <form method="dialog" class="dialog-head"><h2 id="newcase-title">Open a case</h2><button class="ghost icon" aria-label="Close">×</button></form>
  <form id="newcase-form" class="stack"></form>
</dialog>

<dialog id="help-dialog" aria-labelledby="help-title">
  <form method="dialog" class="dialog-head"><h2 id="help-title">Keys and legend</h2><button class="ghost icon" aria-label="Close">×</button></form>
  <div id="help-body"></div>
</dialog>
<script type="module" src="/app.js"></script>
</body></html>
